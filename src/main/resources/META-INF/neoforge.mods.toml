modLoader = "javafml" #mandatory
loaderVersion = "[4,)" #mandatory This is typically bumped every Minecraft version by Forge. See https://files.minecraftforge.net/ for a list of versions.
license = "MIT"
issueTrackerURL="https://github.com/dinnermc/Pondus/issues"
[[mods]]
modId = "pondus"
version = "1.1.0"
displayName = "Pondus"
displayURL="https://github.com/dinnermc/Pondus"
logoFile = "pondus.png"
credits = "Thanks to tfarecnim for making Gravity Control"
authors = "Dinner"
description = '''High-performance custom gravity API for Minecraft: 3D gravity directions, smooth planetary/spherical zones, zero-G space support, timed & item-based modifiers, and custom GravitySources.'''
[[mixins]]
config = "pondus.mixins.json"
[[mixins]]
config = "pondus.neoforge.mixins.json"
[[dependencies.pondus]] #optional
modId = "neoforge" #mandatory
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[21.1.197,)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.pondus]]
modId = "minecraft"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[1.21.1, 1.22)"
ordering = "NONE"
side = "BOTH"
[[dependencies.pondus]]
modId = "cloth_config"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange="*"
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'