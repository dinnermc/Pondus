modLoader = "javafml" #mandatory
loaderVersion = "[4,)" #mandatory This is typically bumped every Minecraft version by Forge. See https://files.minecraftforge.net/ for a list of versions.
license = "CC-BY-NC-SA-4.0" # Review your options at https://choosealicense.com/.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "pondus" #mandatory
version = "1.0.1" #mandatory
displayName = "Pondus" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://mcforge.readthedocs.io/en/latest/gettingstarted/autoupdate/)
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional (displayed in the mod UI)
logoFile = "pondus.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
credits = "Thanks to tfarecnim for making Gravity Control" #optional
authors = "Dinner" #optional
description = '''Adds high performance Custom Gravity to minecraft. Fork of "Gravity Changer Unofficial Port"
Accepts multilines.''' #mandatory (Supports multiline text)
[[mixins]]
config = "pondus.mixins.json"
[[mixins]]
config = "pondus.neoforge.mixins.json"
[[dependencies.pondus]] #optional
modId = "neoforge" #mandatory
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[21.1.197,)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.pondus]]
modId = "minecraft"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[1.21.1, 1.22)"
ordering = "NONE"
side = "BOTH"
[[dependencies.pondus]]
modId = "cloth_config"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange="*"
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'